services:
  postgres:
    image: postgres:15.3-alpine
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_DB: transitmix
    volumes:
      - ./data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: ruby:3.2.2
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/transitmix"
      PORT: ${PORT:-8080}
      # Set RACK_ENV=production to use Vite build assets
      # In dev mode (default), run `npm run dev` separately for HMR
      RACK_ENV: ${RACK_ENV:-development}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - ./:/app